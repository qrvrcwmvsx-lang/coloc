:root{--paper:#f4f1e9;--ink:#20251f;--muted:#70766d;--line:#d9d8ce;--green:#345c49;--mint:#e5eee6;--gold:#d69d46;--white:#fffefa;--shadow:0 24px 70px #23332416}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:960px;margin:auto;padding:34px 24px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font:700 20px Georgia}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font:500 clamp(22px,3vw,30px)/1.2 Georgia,serif;margin:2px 0 0}.tag{border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--muted);font-size:12px;white-space:nowrap}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin:28px 0 18px}.intro p{margin:5px 0 0;color:var(--muted);max-width:560px}.stats{display:flex;gap:18px;white-space:nowrap}.stat strong{font:500 24px Georgia;display:block}.stat span{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 18px}select,.quiet{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 13px}select{min-width:200px}.progress{height:4px;background:#dedfd5;border-radius:8px;overflow:hidden;margin-bottom:24px}.progress i{height:100%;display:block;background:var(--gold);width:0;transition:width .25s}.stage{min-height:390px;background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(24px,5vw,54px);display:flex;flex-direction:column;position:relative}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}.kind{color:var(--green)}.prompt{font:500 clamp(24px,4vw,38px)/1.28 Georgia,serif;margin:auto 0;text-wrap:pretty;max-width:760px}.answer{display:none;color:#454c44;border-top:1px solid var(--line);padding-top:20px;margin-top:2px;white-space:pre-line}.stage.revealed .answer{display:block}.stage.revealed .prompt{font-size:clamp(21px,3vw,30px);margin:25px 0 18px}.source{font-size:12px;color:var(--muted);margin-top:auto;padding-top:24px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:13px 23px;font:600 14px inherit;cursor:pointer;transition:transform .15s,opacity .15s}.btn:hover{transform:translateY(-1px)}.btn.secondary{background:var(--mint);color:var(--green)}.btn:disabled{opacity:.4;cursor:default;transform:none}.hint{text-align:center;color:var(--muted);font-size:12px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:30px;color:var(--muted);font-size:12px}.quiet{font-size:12px;padding:7px 10px;cursor:pointer;color:var(--muted)}.empty{margin:auto;text-align:center;color:var(--muted)}@media(max-width:620px){.wrap{padding:22px 16px 32px}.intro{align-items:start;flex-direction:column}.stats{width:100%;justify-content:space-between}.stage{min-height:360px}.tag{display:none}.bottom{gap:10px}.prompt{font-size:27px}}

<body><main class="wrap">
<header class="top"><div class="brand"><div class="mark">∫</div><div><div class="eyebrow">Коллоквиум · набор 01</div><h1>Математический анализ</h1></div></div><div class="tag">11 билетов · 121 карточка</div></header>
<section class="intro"><div><div class="eyebrow">Повторяй активно</div><p>Сначала попробуй ответить вслух, затем переверни карточку. Отмечай то, что уже уверенно знаешь.</p></div><div class="stats"><div class="stat"><strong id="knownCount">0</strong><span>знаю</span></div><div class="stat"><strong id="leftCount">0</strong><span>осталось</span></div></div></section>

<script>
const cards=[
{t:1,k:'Определение',q:'Что означает A ⊆ B? Когда множества равны?',a:'A ⊆ B, если каждый элемент A принадлежит B. Равенство A = B эквивалентно двум включениям: A ⊆ B и B ⊆ A.',p:2},
{t:1,k:'Теорема',q:'Сформулируй законы де Моргана для семейств множеств.',a:'Дополнение объединения равно пересечению дополнений: (⋃ᵢ Aᵢ)ᶜ = ⋂ᵢ Aᵢᶜ. Дополнение пересечения равно объединению дополнений: (⋂ᵢ Aᵢ)ᶜ = ⋃ᵢ Aᵢᶜ. Доказательство сводится к отрицанию кванторов принадлежности.',p:3},
{t:1,k:'Парадокс',q:'В чём состоит парадокс Рассела?',a:'Рассмотрим R = {X : X ∉ X}, множество всех множеств, не содержащих себя. Тогда R ∈ R ⇔ R ∉ R — противоречие. Это показывает проблему наивной теории множеств.',p:4,active:false},
{t:2,k:'Определение',q:'Что такое декартово произведение и отношение?',a:'A × B — множество упорядоченных пар (a,b), где a∈A, b∈B. Отношение между A и B — любое подмножество R ⊆ A × B.',p:5,active:false},
{t:2,k:'Определение',q:'Когда отношение является отображением f:A→B?',a:'Если каждому a∈A поставлен в соответствие ровно один элемент b∈B. Образ f(A) состоит из значений f(a), а прообраз f⁻¹(C) — из тех a, чьи значения попали в C. Прообраз существует и без обратной функции.',p:6},
{t:2,k:'Понятие',q:'Чем инъекция отличается от сюръекции?',a:'Инъекция: разные элементы области имеют разные образы. Сюръекция: каждый элемент B является образом хотя бы одного a∈A. Биекция одновременно инъективна и сюръективна; у неё есть обратное отображение.',p:6},
{t:3,k:'Определение',q:'Назови свойства частичного порядка.',a:'Рефлексивность: a≤a. Транзитивность: из a≤b и b≤c следует a≤c. Антисимметричность: из a≤b и b≤a следует a=b. Линейный порядок дополнительно сравнивает любую пару элементов.',p:8},
{t:3,k:'Различие',q:'Максимальный элемент и наибольший элемент — одно и то же?',a:'Нет. Наибольший элемент не меньше любого элемента множества. Максимальный элемент лишь не имеет строго большего элемента внутри множества. Например, {{1},{2}} с порядком включения имеет два максимальных элемента, но не имеет наибольшего.',p:9},
{t:3,k:'Теорема',q:'Что утверждает лемма Цорна?',a:'Если в частично упорядоченном непустом множестве каждая цепь имеет верхнюю грань, то существует максимальный элемент. Максимальный элемент не обязательно наибольший. Лемма эквивалентна аксиоме выбора.',p:10},
{t:4,k:'Определение',q:'Что значит, что s = sup A?',a:'s — верхняя грань A, и сколь угодно близко к s снизу найдётся элемент A: для любого ε>0 существует x∈A такой, что s−ε<x≤s. Нужны непустота A и ограниченность сверху.',p:11},
{t:4,k:'Теорема',q:'Сформулируй аксиому полноты (непрерывности) ℝ.',a:'Если X,Y непусты и каждый x∈X не превосходит каждый y∈Y, то существует c∈ℝ, разделяющий их: x≤c≤y для всех x∈X,y∈Y. Это свойство эквивалентно существованию точной верхней грани у всякого непустого ограниченного сверху множества.',p:12},
{t:4,k:'Проверь себя',q:'Почему в теореме о sup важны непустота и ограниченность?',a:'Пустое множество не задаёт требуемую точную верхнюю грань в стандартной постановке, а неограниченное сверху множество не имеет конечной верхней грани в ℝ. Оба условия необходимы.',p:12},
{t:5,k:'Определение',q:'Что значит, что A ⊆ ℝ правоиндуктивно?',a:'Если x∈A, то x+1∈A. Левоиндуктивность определяется аналогично: x∈A влечёт x−1∈A. Минимальную правоиндуктивную лестницу из x получают пересечением всех правоиндуктивных множеств, содержащих x.',p:14},
{t:5,k:'Доказательство',q:'Почему непустое правоиндуктивное A ⊆ ℝ не ограничено сверху?',a:'Предположим, что s=sup A. Тогда s−1 не верхняя грань, значит найдётся y∈A с y>s−1. По правоиндуктивности y+1∈A, но y+1>s — противоречие.',p:15},
{t:6,k:'Факт',q:'Какое соглашение о натуральных числах принято в конспекте?',a:'ℕ = {1,2,3,…}. Между соседними целыми n и n+1 нет целого числа; это свойство дискретности. Не смешивай принятое здесь соглашение с курсами, где 0 включают в ℕ.',p:17},
{t:6,k:'Теорема',q:'Что верно о непустом ограниченном подмножестве ℤ?',a:'Оно имеет наибольший элемент, если ограничено сверху, и наименьший, если ограничено снизу. Также ℤ замкнуто относительно сложения, вычитания и умножения.',p:18},
{t:7,k:'Определение',q:'Что такое целая часть [x]?',a:'[x] = max{n∈ℤ : n≤x}; поэтому [x]≤x<[x]+1. Для любого h>0 единственное целое n удовлетворяет (n−1)h≤x<nh.',p:20},
{t:7,k:'Теорема',q:'Сформулируй архимедово свойство ℝ.',a:'Для любых a>0 и b∈ℝ найдётся n∈ℕ такое, что na>b. Следствие: рациональные числа всюду плотны — между любыми a<b есть рациональное число.',p:21},
{t:7,k:'Метод',q:'Как доказывается плотность ℚ в ℝ через архимедово свойство?',a:'Выбрать n так, чтобы 1/n<b−a. Затем подобрать целое m, попадающее в увеличенный на n интервал (na,nb); тогда a<m/n<b.',p:21},
{t:7,k:'Метод',q:'Что такое сильная индукция?',a:'Чтобы доказать утверждение для всех n, предполагают его верность для всех меньших значений и выводят случай n. Часто доказательство начинают с наименьшего контрпримера, существование которого противоречит хорошей упорядоченности ℕ.',p:22,active:false},
{t:8,k:'Определение',q:'Когда множество называется конечным?',a:'Если оно пусто или существует биекция с Dₙ={1,…,n} для некоторого n∈ℕ. Число n называется мощностью множества; оно определяется однозначно.',p:23},
{t:8,k:'Следствие',q:'Что можно сказать о подмножестве конечного множества?',a:'Оно конечно, и его мощность не превосходит мощности исходного множества. Объединение конечного числа конечных множеств также конечно.',p:24},
{t:8,k:'Формула',q:'Формула мощности объединения двух конечных множеств?',a:'|A∪B| = |A|+|B|−|A∩B|. Если A и B не пересекаются, то |A∪B|=|A|+|B|.',p:25},
{t:9,k:'Неравенство',q:'Сформулируй неравенство Бернулли.',a:'При x>−1 и n∈ℕ: (1+x)ⁿ ≥ 1+nx. Равенство имеет место при x=0 или n=1; в остальных случаях неравенство строгое.',p:26},
{t:9,k:'Формула',q:'Сформулируй биномиальную формулу Ньютона.',a:'(a+b)ⁿ = Σₖ₌₀ⁿ Cₙᵏ aⁿ⁻ᵏbᵏ, где Cₙᵏ=n!/(k!(n−k)!). Коэффициенты удовлетворяют формуле Паскаля Cₙᵏ=Cₙ₋₁ᵏ+Cₙ₋₁ᵏ⁻¹.',p:27},
{t:9,k:'Идея доказательства',q:'Как доказывают формулу Ньютона индукцией?',a:'База n=0 или n=1 очевидна. Умножают разложение для n на (a+b), группируют соседние слагаемые и применяют формулу Паскаля, получая коэффициенты для n+1.',p:27},
{t:10,k:'Определение',q:'Что такое модуль и расстояние на числовой прямой?',a:'|x| — расстояние от x до нуля. Расстояние между x и y: ρ(x,y)=|x−y|. Оно неотрицательно, симметрично, равно нулю только при x=y и удовлетворяет неравенству треугольника.',p:28},
{t:10,k:'Формулы',q:'Запиши неравенства треугольника и окрестность точки.',a:'|x+y|≤|x|+|y|; обратное неравенство: ||x|−|y||≤|x−y|. Окрестность Uᵣ(a)={x:|x−a|<r}=(a−r,a+r).',p:29},
{t:11,k:'Определение',q:'Что такое симметрическая разность A△B?',a:'A△B=(A\\B)∪(B\\A)=(A∪B)\\(A∩B): множество точек, принадлежащих ровно одному из множеств.',p:31},
{t:11,k:'Оценка',q:'Как оценивается изменение объединения или пересечения?',a:'Изменение результата содержится в объединении изменений входов: например, (A∪B)△(C∪D) ⊆ (A△C)∪(B△D). Также A△C ⊆ (A△B)∪(B△C).',p:32,active:false},
{t:11,k:'Определение',q:'Как задаётся длина элементарного множества?',a:'Элементарное множество — конечное объединение ограниченных интервалов. Разбивают его на непересекающиеся интервалы и складывают длины b−a; общая длина не зависит от разбиения. Длина одноточечного множества и пустого множества равна нулю.',p:34},
{t:11,k:'Свойства',q:'Назови свойства длины элементарных множеств.',a:'Длина неотрицательна и монотонна; длина объединения непересекающихся множеств равна сумме длин. |A∪B|=|A|+|B|−|A∩B|.',p:37,active:false},
{t:12,k:'Теорема',q:'Сформулируй лемму Кантора о вложенных отрезках.',a:'Если I₁⊇I₂⊇… — непустые замкнутые ограниченные отрезки, то их пересечение непусто. Если длины отрезков стремятся к нулю, пересечение состоит ровно из одной точки.',p:39},
{t:12,k:'Доказательство',q:'Как найти общую точку вложенных отрезков?',a:'Пусть Iₙ=[aₙ,bₙ], и c=sup{aₙ}. Вложенность показывает, что каждый bₙ — верхняя грань всех левых концов, поэтому aₙ≤c≤bₙ для каждого n. Значит, c принадлежит всем отрезкам.',p:40},
{t:12,k:'Уточнение',q:'Почему при длинах, стремящихся к нулю, общая точка единственна?',a:'Если бы общих точек было две, между ними было бы фиксированное расстояние δ>0. Но достаточно поздний отрезок имеет длину меньше δ и не может содержать обе точки.',p:40},
{t:13,k:'Определение',q:'Что значит, что множество открыто?',a:'Множество открыто, если каждая его точка имеет окрестность, целиком лежащую в этом множестве. Дополнение открытого множества называется замкнутым; эквивалентно, множество замкнуто тогда и только тогда, когда его дополнение открыто.',p:42},
{t:13,k:'Свойства',q:'Какие объединения и пересечения открытых множеств открыты?',a:'Произвольное объединение открытых множеств открыто; конечное пересечение открытых множеств открыто. Бесконечное пересечение может не быть открытым: ⋂ₙ(−1/n,1/n)={0}. Для замкнутых множеств действует двойственное правило.',p:43},
{t:13,k:'Теорема',q:'Сформулируй теорему Бореля—Лебега.',a:'Из любого открытого покрытия замкнутого ограниченного отрезка можно выбрать конечное подпокрытие.',p:44},
{t:13,k:'Идея доказательства',q:'Как устроено доказательство Бореля—Лебега делением пополам?',a:'Предположить, что конечного подпокрытия нет. Делить отрезок пополам и каждый раз выбирать половину без конечного подпокрытия. Получить вложенные отрезки с общей точкой c. Элемент покрытия, содержащий c, содержит окрестность c; достаточно короткий выбранный отрезок целиком в ней — противоречие.',p:45},
{t:1,k:'Термин',q:'Что такое универсум E в задаче?',a:'Это множество объектов, которые рассматриваются именно в данной задаче. Например, при решении неравенства на прямой обычно берут E=ℝ. Это не «множество вообще всех объектов».',p:2},
{t:1,k:'Термин',q:'Чем отличаются принадлежность и включение?',a:'a∈A говорит об элементе и множестве. A⊆B сравнивает два множества и означает, что каждый элемент A лежит в B.',p:2},
{t:1,k:'Определение',q:'Что такое дополнение множества A?',a:'Дополнение относительно выбранного универсума E — это E\\A, то есть элементы E, не принадлежащие A. Без универсума понятие дополнения не определено однозначно.',p:3},
{t:1,k:'Понятие',q:'Что означает ∪ семейства множеств? А ∩?',a:'x∈⋃ᵢXᵢ тогда и только тогда, когда x принадлежит хотя бы одному Xᵢ. x∈⋂ᵢXᵢ тогда и только тогда, когда x принадлежит каждому Xᵢ.',p:3},
{t:1,k:'Логика',q:'Как отрицать утверждения с кванторами ∀ и ∃?',a:'¬∀x P(x) равносильно ∃x¬P(x). ¬∃x P(x) равносильно ∀x¬P(x). Эта замена лежит в основе доказательства законов де Моргана.',p:2},
{t:1,k:'Доказательство',q:'Как доказать равенство двух множеств?',a:'Пусть x произвольный. Докажи эквивалентность x∈A ⇔ x∈B. Эквивалентный способ — отдельно показать A⊆B и B⊆A.',p:2},
{t:1,k:'Аксиомы',q:'Какие операции построения множеств перечислены в конспекте?',a:'Подмножество множества является множеством; все подмножества A образуют множество P(A); можно выделить в множестве элементы с заданным свойством; объединение семейства множеств, являющегося множеством, тоже является множеством.',p:2,active:false},
{t:1,k:'Проверь себя',q:'Если A={1,2,3}, B={3,4}, чему равны A∩B, A∪B и A\\B?',a:'A∩B={3}; A∪B={1,2,3,4}; A\\B={1,2}. В объединении «или» включающее: элемент может лежать в обоих множествах.',p:3},
{t:1,k:'Доказательство',q:'Как доказать первое равенство де Моргана через принадлежность?',a:'Для любого x: x∉⋃ᵢXᵢ ⇔ x не принадлежит ни одному Xᵢ ⇔ для всех i, x∉Xᵢ ⇔ x∈⋂ᵢ(E\\Xᵢ). Значит, дополнения множеств совпадают.',p:3},
{t:1,k:'Доказательство',q:'Как доказать второе равенство де Моргана через принадлежность?',a:'Для любого x: x∉⋂ᵢXᵢ ⇔ неверно, что x принадлежит каждому Xᵢ ⇔ существует i, для которого x∉Xᵢ ⇔ x∈⋃ᵢ(E\\Xᵢ).',p:4},
{t:2,k:'Определение',q:'Когда две упорядоченные пары равны?',a:'(a,b)=(c,d) тогда и только тогда, когда a=c и b=d. Порядок координат важен.',p:5},
{t:2,k:'Свойство',q:'Когда декартово произведение A×B пусто?',a:'Если хотя бы один множитель пуст, A×B=∅. Если оба множителя непусты, можно выбрать по элементу и получить пару из произведения.',p:5,active:false},
{t:2,k:'Термин',q:'Что такое область определения и множество значений отношения R⊆A×B?',a:'Область определения — первые координаты пар из R, она содержится в A. Множество значений — вторые координаты, оно содержится в B. Равенство A и области определения или B и значений не обязательно.',p:5},
{t:2,k:'Различие',q:'Чем множество значений f(A) отличается от множества, в которое отображает f:A→B?',a:'B — весь кодомен, объявленный в отображении; f(A) — фактически достигнутые значения, поэтому f(A)⊆B и включение может быть строгим.',p:6},
{t:2,k:'Определение',q:'Как определить график отображения f:A→B?',a:'Γ_f={(a,f(a)):a∈A} — подмножество A×B, состоящее из входа и соответствующего ему выхода.',p:6},
{t:2,k:'Различие',q:'Почему f⁻¹(D) не обязательно означает обратное отображение?',a:'Прообраз D⊆B определён для любого отображения: это {x∈A:f(x)∈D}. Обратная функция существует только у биекции. Прообраз точки может содержать несколько элементов или быть пустым.',p:6},
{t:2,k:'Пример',q:'Для f(x)=x² на ℝ найди прообразы {4} и {−1}.',a:'f⁻¹({4})={−2,2}; f⁻¹({−1})=∅, потому что квадрат действительного числа неотрицателен.',p:6},
{t:2,k:'Определение',q:'Что значит, что отображение инъективно?',a:'Если f(a)=f(a′), то a=a′. Эквивалентно: разные входы имеют разные образы.',p:6},
{t:2,k:'Определение',q:'Что значит, что отображение сюръективно?',a:'f:A→B сюръективно, если для каждого b∈B найдётся a∈A с f(a)=b; то есть f(A)=B.',p:6},
{t:2,k:'Следствие',q:'Что верно для обратного отображения биекции?',a:'Если f:A→B биективно, обратное f⁻¹:B→A тоже биективно, и f⁻¹(f(a))=a, f(f⁻¹(b))=b.',p:6},
{t:2,k:'Понятие',q:'Что представляет собой произведение семейства множеств?',a:'Это множество функций выбора x, заданных на множестве индексов I, для которых x(α)∈Xα для каждого α. Элемент произведения выбирает по одной координате из каждого множества.',p:7,active:false},
{t:2,k:'Связь',q:'Как подмножество I кодируют характеристической функцией?',a:'Для B⊆I функция χ_B:I→{0,1} равна 1 на B и 0 вне B. Так подмножества I взаимно однозначно соответствуют функциям I→{0,1}.',p:7,active:false},
{t:3,k:'Пример',q:'Почему включение на P({1,2}) задаёт частичный, но не линейный порядок?',a:'Включение рефлексивно, транзитивно и антисимметрично. Но {1} и {2} несравнимы: ни одно из этих множеств не содержится в другом.',p:8,active:false},
{t:3,k:'Определение',q:'Что значит, что два элемента частичного порядка сравнимы?',a:'a и b сравнимы, если a≤b или b≤a. Линейный порядок требует сравнимости любых двух элементов.',p:8},
{t:3,k:'Определение',q:'Чем минимальный элемент отличается от наименьшего?',a:'Минимальный элемент не имеет строго меньшего элемента множества. Наименьший элемент сам не превосходит ни одного элемента. В частичном порядке минимальных может быть несколько, а наименьший, если есть, единственен.',p:9},
{t:3,k:'Определение',q:'Что такое верхняя грань множества X?',a:'Элемент u окружающего упорядоченного множества, для которого x≤u при каждом x∈X. Верхняя грань не обязана принадлежать X.',p:9},
{t:3,k:'Различие',q:'Чем sup X отличается от максимума X?',a:'sup X — наименьшая из верхних граней и может не принадлежать X. Максимум обязан лежать в X. Например, у (0,1) супремум 1, но максимума нет.',p:9},
{t:3,k:'Определение',q:'Что такое цепь в частично упорядоченном множестве?',a:'Подмножество, на котором любые два элемента сравнимы; иначе говоря, цепь сама линейно упорядочена.',p:10},
{t:3,k:'Определение',q:'Что значит, что порядок вполне упорядочен?',a:'Линейно упорядоченное множество вполне упорядочено, если каждое его непустое подмножество имеет наименьший элемент.',p:9},
{t:3,k:'Примеры',q:'Какие из ℕ, ℤ и [0,1] вполне упорядочены обычным порядком?',a:'ℕ вполне упорядовано. ℤ — нет: у самого ℤ нет наименьшего элемента. [0,1] — нет: подмножество (0,1) не имеет наименьшего элемента.',p:9},
{t:3,k:'Теорема',q:'Что утверждает теорема Цермело?',a:'На любом множестве можно задать линейный порядок, относительно которого множество становится вполне упорядоченным. Она не утверждает, что привычный порядок на ℝ вполне упорядочен.',p:9,active:false},
{t:3,k:'Сопоставление',q:'Сравни принципы Цермело, Куратовского и лемму Цорна.',a:'Цермело: на множестве есть вполне упорядочение. Куратовский: всякая цепь содержится в максимальной цепи. Цорн: если всякая цепь имеет верхнюю грань, есть максимальный элемент. В конспекте они перечислены как эквивалентные формы аксиомы выбора.',p:9,active:false},
{t:3,k:'Определение',q:'Что такое аксиома выбора?',a:'Для любого семейства непустых множеств существует функция, выбирающая из каждого множества по одному элементу. Эквивалентная формулировка: произведение непустых множителей непусто.',p:9},
{t:4,k:'Определение',q:'Какие алгебраические и порядковые свойства имеет ℝ в формулировке конспекта?',a:'ℝ — упорядоченное поле: сложение, умножение и порядок согласованы с обычными правилами поля и порядковой совместимостью. К этим свойствам добавляется аксиома полноты, отличающая ℝ от ℚ.',p:11},
{t:4,k:'Формулировка',q:'В чём принцип непрерывности (разделения) для ℝ?',a:'Если X,Y непусты и x≤y для всех x∈X,y∈Y, найдётся c∈ℝ такое, что x≤c≤y для всех x,y. Точка c разделяет два упорядоченных класса.',p:12},
{t:4,k:'Критерий',q:'Запиши критерий супремума через ε.',a:'s=sup X тогда и только тогда, когда s — верхняя грань X и для каждого ε>0 найдётся x∈X с s−ε<x. Значит, к s можно приблизиться снизу сколь угодно близко.',p:12},
{t:4,k:'Следствие',q:'Что гарантирует полнота о непустом ограниченном множестве?',a:'У всякого непустого множества, ограниченного сверху, существует единственный конечный супремум; если оно ограничено снизу, существует единственный конечный инфимум.',p:12},
{t:4,k:'Пример',q:'Есть ли максимум у множества {x∈ℝ:0<x<1}? Чему равен sup?',a:'Максимума нет: 1 не принадлежит множеству, а любой его элемент можно увеличить, оставаясь меньше 1. Супремум равен 1.',p:12},
{t:5,k:'Примеры',q:'Приведи примеры право-, лево- и двусторонне-индуктивных множеств.',a:'[0,+∞) право-индуктивно; (−∞,0] лево-индуктивно; ℤ двусторонне-индуктивно. Пустое множество формально удовлетворяет обоим условиям, поскольку в нём нет элемента, нарушающего импликацию.',p:14},
{t:5,k:'Свойство',q:'Что делает с типом индуктивности сдвиг множества?',a:'Сдвиг x+A сохраняет тип: если A право-индуктивно, то x+A тоже право-индуктивно; аналогично для лево- и двусторонней индуктивности.',p:15},
{t:5,k:'Свойство',q:'Как отражение A↦−A меняет индуктивность?',a:'Отражение меняет правоиндуктивность на левоиндуктивность и наоборот; двусторонняя индуктивность сохраняется.',p:15},
{t:5,k:'Свойство',q:'Сохраняют ли объединение и пересечение индуктивность одного типа?',a:'Да. Объединение и пересечение семейств право-индуктивных множеств право-индуктивны; аналогично для лево- и двусторонней индуктивности.',p:15},
{t:5,k:'Определение',q:'Как задают минимальное правоиндуктивное множество, содержащее x?',a:'ℤ₊(x) — пересечение всех право-индуктивных множеств, содержащих x. Оно само право-индуктивно и содержится в любом другом таком множестве.',p:16},
{t:5,k:'Свойство',q:'Сформулируй минимальность ℤ₊(x).',a:'Если A право-индуктивно и x∈A, то ℤ₊(x)⊆A. Это напрямую следует из определения как пересечения всех подходящих множеств.',p:16},
{t:5,k:'Теорема',q:'Как формулируется симметричный результат для левоиндуктивных множеств?',a:'Непустое левоиндуктивное множество не ограничено снизу. Доказательство зеркально доказательству для правоиндуктивного множества.',p:16},
{t:6,k:'Определение',q:'Как связаны натуральные числа и правоиндуктивность в конспекте?',a:'ℕ — минимальное право-индуктивное подмножество ℝ, содержащее 1; принято соглашение ℕ={1,2,3,…}.',p:17},
{t:6,k:'Факт',q:'Есть ли целое число строго между n и n+1?',a:'Нет. Соседние целые разделены единичным шагом; это дискретность ℤ.',p:17},
{t:6,k:'Следствие',q:'Что даёт ограниченность целочисленного множества сверху?',a:'Непустое A⊆ℤ, ограниченное сверху, имеет максимум. В частности, для целых чисел конечна возможность подниматься единичными шагами до заданной верхней границы.',p:18},
{t:6,k:'Доказательство',q:'Как доказывают существование максимума у ограниченного сверху A⊆ℤ?',a:'Выбрать целую верхнюю грань N. Множество N−A состоит из целых неотрицательных чисел и непусто; у него есть наименьший элемент по дискретности/хорошей упорядоченности. Соответствующий элемент A и будет максимальным.',p:18},
{t:6,k:'Свойство',q:'Какие арифметические операции замкнуты на ℤ?',a:'Сумма, разность и произведение целых чисел снова целые. Это выводится из построения целых через единичные шаги.',p:18},
{t:6,k:'Принцип',q:'Как работает доказательство от наименьшего контрпримера?',a:'Если множество контрпримеров — непустое подмножество ℕ, у него есть наименьший элемент. Затем показывают, что этот контрпример породил бы меньший, либо что он не может быть контрпримером; получается противоречие.',p:19},
{t:7,k:'Теорема',q:'Сформулируй принцип Архимеда в форме единичного шага h.',a:'Для любого x∈ℝ и h>0 существует единственное n∈ℤ, такое что (n−1)h≤x<nh. Интервалы этой сетки разбивают прямую без пропусков и наложений.',p:20},
{t:7,k:'Следствие',q:'Как из формулы целой части получается разложение x на целую и дробную части?',a:'Существует единственное n=[x]∈ℤ с n≤x<n+1. Поэтому x=[x]+r, где 0≤r<1.',p:20},
{t:7,k:'Доказательство',q:'Как доказывают обычную архимедову формулировку na>b?',a:'Предполагают, что {na:n∈ℕ} ограничено сверху, берут его супремум s. По свойству супремума найдётся m с ma>s−a; тогда (m+1)a>s, противоречие. Значит, множество не ограничено сверху.',p:21},
{t:7,k:'Следствие',q:'Почему между любыми двумя разными вещественными числами есть рациональное?',a:'Для a<b выбери n∈ℕ так, чтобы 1/n<b−a. Затем возьми целое m, первое строго большее na. Тогда na<m≤na+1<nb, следовательно, a<m/n<b.',p:21,active:false},
{t:7,k:'Следствие',q:'Почему в любом интервале (a,b) бесконечно много рациональных?',a:'Для любого N выбери n так, чтобы n(b−a)>N+1. Пусть m — наименьшее целое, строго большее na. Тогда na<m≤na+1, и числа m/n,(m+1)/n,…,(m+N)/n различны и лежат в (a,b).',p:22},
{t:7,k:'Индукция',q:'Сформулируй математическую индукцию при ℕ={1,2,…}.',a:'Если 1∈A и из n∈A следует n+1∈A, то A=ℕ. В формулировке для утверждения доказывают базу n=1 и переход n⇒n+1.',p:22},
{t:7,k:'Индукция',q:'Почему принцип индукции следует из минимальности ℕ?',a:'Множество A, содержащее 1 и замкнутое относительно шага n↦n+1, право-индуктивно. По минимальности ℕ оно содержит ℕ; поскольку A⊆ℕ, получаем A=ℕ.',p:22},
{t:7,k:'Сравнение',q:'Чем сильная индукция отличается от обычной?',a:'В сильном переходе для n предполагают утверждение для всех меньших натуральных чисел, а не только для n−1. Метод наименьшего контрпримера часто доказывает именно такую форму.',p:22},
{t:7,k:'Обобщение',q:'Что такое трансфинитная индукция?',a:'Обобщение индукции на вполне упорядоченные множества: чтобы доказать P(α), предполагают P(β) для всех β<α и выводят P(α), проверив начальные случаи.',p:22},
{t:8,k:'Определение',q:'Что такое стандартное множество Dₙ?',a:'Dₙ={1,…,n}; D₀ иногда используют как пустое множество в доказательствах. Конечность означает существование биекции с некоторым Dₙ.',p:23},
{t:8,k:'Теорема',q:'Почему мощность конечного множества определена однозначно?',a:'Если есть биекции множества с Dₘ и Dₙ, то Dₘ и Dₙ равномощны. Индукцией по меньшему индексу показывают, что это возможно только при m=n.',p:23},
{t:8,k:'Следствие',q:'Что верно о конечном подмножестве конечного множества A?',a:'Подмножество B⊆A конечно и |B|≤|A|. Если B строго меньше A, то |B|<|A|.',p:24},
{t:8,k:'Теорема',q:'Почему ограниченное сверху подмножество ℕ конечно?',a:'Если B⊆ℕ ограничено сверху числом M, то каждый его элемент не больше некоторого натурального N≥M. Следовательно, B⊆{1,…,N}, а подмножество конечного множества конечно.',p:24},
{t:8,k:'Подсчёт',q:'Сколько элементов в объединении непересекающихся конечных A и B?',a:'|A∪B|=|A|+|B|. Для пересекающихся множеств элементы пересечения нужно вычесть один раз: |A∪B|=|A|+|B|−|A∩B|.',p:25},
{t:9,k:'Условия',q:'При каких условиях применимо неравенство Бернулли в конспекте?',a:'Для x>−1 и натурального n: (1+x)ⁿ≥1+nx. Условие x>−1 гарантирует положительность 1+x.',p:26},
{t:9,k:'Доказательство',q:'Как устроен индукционный шаг в доказательстве Бернулли?',a:'Предполагают (1+x)ⁿ≥1+nx и умножают на положительное 1+x. Получают (1+x)ⁿ⁺¹≥(1+nx)(1+x)=1+(n+1)x+nx²≥1+(n+1)x.',p:26},
{t:9,k:'Формула',q:'Как определить биномиальный коэффициент Cₙᵏ?',a:'Cₙᵏ=n!/[k!(n−k)!] при 0≤k≤n. Он задаёт коэффициент при aⁿ⁻ᵏbᵏ в разложении (a+b)ⁿ.',p:27},
{t:9,k:'Формула',q:'Запиши формулу Паскаля и объясни её смысл.',a:'Cₙ₊₁ᵏ=Cₙᵏ+Cₙᵏ⁻¹. При умножении разложения (a+b)ⁿ на (a+b) коэффициенты соседних степеней складываются.',p:27},
{t:9,k:'Проверь себя',q:'Какие крайние коэффициенты в формуле Ньютона?',a:'Cₙ⁰=Cₙⁿ=1, поэтому крайние слагаемые — aⁿ и bⁿ.',p:27},
{t:10,k:'Определение',q:'Как модуль определяется через знак числа?',a:'|x|=x при x≥0 и |x|=−x при x<0. Геометрически это расстояние от x до нуля.',p:28},
{t:10,k:'Свойство',q:'Назови основные свойства модуля.',a:'|x|≥0; |x|=0 ⇔ x=0; |xy|=|x||y|; |x+y|≤|x|+|y|; ||x|−|y||≤|x−y|.',p:29},
{t:10,k:'Метрика',q:'Какие аксиомы выполняет расстояние ρ(x,y)=|x−y|?',a:'Неотрицательность; ρ(x,y)=0 тогда и только тогда, когда x=y; симметрия ρ(x,y)=ρ(y,x); неравенство треугольника ρ(x,z)≤ρ(x,y)+ρ(y,z).',p:29},
{t:10,k:'Геометрия',q:'Во что превращается окрестность Uᵣ(a) на вещественной прямой?',a:'Uᵣ(a)={x:|x−a|<r}=(a−r,a+r), где r>0. Это открытый интервал с центром a и радиусом r.',p:29},
{t:10,k:'Геометрия',q:'Как записать замкнутый шар радиуса r на прямой?',a:'{x:|x−a|≤r}=[a−r,a+r]. Открытая окрестность использует строгое неравенство, замкнутый шар включает границы.',p:29},
{t:11,k:'Эквивалентная формула',q:'Запиши A△B через объединение и пересечение.',a:'A△B=(A∪B)\\(A∩B). В этой разности остаются элементы, которые попали хотя бы в одно множество, но не в оба.',p:31},
{t:11,k:'Свойство',q:'Что означает включение A△C⊆(A△B)∪(B△C)?',a:'Если принадлежность элемента A и C различается, то она должна различаться либо между A и B, либо между B и C. Это треугольное неравенство для симметрической разности.',p:32},
{t:11,k:'Лемма',q:'Как ограничить изменение результата при замене одного аргумента?',a:'Например, (A∪B)△(C∪B)⊆A△C. Измениться могут только точки, на которых изменился заменённый аргумент. Аналогичные оценки есть для пересечения и разности.',p:32,active:false},
{t:11,k:'Длина',q:'Зависит ли длина от того, включены ли концы интервала?',a:'Нет. Интервалы с одинаковыми концами a,b имеют длину b−a независимо от открытости или замкнутости концов. Пустое множество и одноточечный интервал имеют длину 0.',p:33},
{t:11,k:'Длина',q:'Почему длина конечного объединения непересекающихся интервалов определена корректно?',a:'Два конечных разбиения можно уточнить общим разбиением. Суммы длин после разрезания не меняются, поскольку соседние длины складываются: (b−a)+(c−b)=c−a. Поэтому итог не зависит от выбора разбиения.',p:34},
{t:11,k:'Определение',q:'Какое множество называется элементарным?',a:'Конечное объединение ограниченных интервалов. Такие множества сохраняют элементарность при конечных объединениях, пересечениях и разностях.',p:34},
{t:11,k:'Свойство',q:'Сформулируй конечную аддитивность длины.',a:'Если элементарные множества A и B не пересекаются, то |A∪B|=|A|+|B|. Для конечного числа попарно непересекающихся элементарных множеств длина объединения равна сумме длин.',p:36},
{t:11,k:'Свойство',q:'Что означает монотонность длины?',a:'Если A⊆B и оба множества элементарны, то |A|≤|B|. Интуитивно включение не может увеличить длину меньшего множества относительно большего.',p:36},
{t:11,k:'Формула',q:'Как выразить длину разности A\\B?',a:'|A\\B|=|A|−|A∩B|. Разбиваем A на непересекающиеся части A\\B и A∩B и применяем аддитивность.',p:37},

{t:4,k:'Пример',q:'Найди sup и inf множества (0,1). Есть ли у него max или min?',a:'sup(0,1)=1, inf(0,1)=0. Максимума и минимума нет, потому что обе граничные точки не входят в интервал.',p:12},
{t:4,k:'Критерий',q:'Как проверить, что число s — точная верхняя грань A?',a:'Нужно проверить два условия: (1) x≤s для каждого x∈A; (2) для любого ε>0 найдётся x∈A с s−ε<x. Первое делает s верхней гранью, второе — наименьшей из них.',p:12},
{t:4,k:'Сравнение',q:'Чем полнота ℝ отличается от свойств упорядоченного поля?',a:'Аксиомы упорядоченного поля описывают арифметику и порядок. Полнота добавляет отсутствие «пробелов»: всякое непустое ограниченное сверху множество имеет sup. Например, ℚ — упорядоченное поле, но не полное.',p:11},
{t:5,k:'Доказательство',q:'Почему ℤ₊(x) само право-индуктивно?',a:'Если y принадлежит пересечению всех право-индуктивных множеств, содержащих x, то y принадлежит каждому из них. Значит, y+1 тоже принадлежит каждому, а потому и их пересечению.',p:16},
{t:5,k:'Сравнение',q:'Как связаны минимальность ℤ₊(x) и принцип индукции?',a:'Минимальность говорит, что ℤ₊(x) содержится в любом право-индуктивном множестве, содержащем x. При x=1 это даёт обычную индукцию для ℕ: любое множество с 1, замкнутое по шагу +1, содержит все натуральные числа.',p:16},
{t:6,k:'Свойство',q:'Как единичный шаг помогает найти максимум конечного диапазона целых?',a:'Если целые элементы множества ограничены сверху целым N, то они лежат среди конечного числа чисел …,N−2,N−1,N. Непустая часть такого конечного набора имеет наибольший элемент.',p:18},
{t:6,k:'Различие',q:'Почему ℕ в этом курсе не содержит ноль?',a:'В конспекте ℕ определяется как {1,2,…} — минимальное право-индуктивное множество, содержащее 1. Поэтому 0 — целое, но не натуральное по принятому здесь соглашению.',p:17},
{t:6,k:'Доказательство',q:'Как принцип наименьшего контрпримера следует из хорошей упорядоченности ℕ?',a:'Если множество натуральных контрпримеров непусто, у него есть наименьший элемент n. Проверив базу и переход от меньших случаев к n, получаем, что n не может быть контрпримером — противоречие.',p:19},
{t:8,k:'Доказательство',q:'Как конечность сохраняется при удалении одного элемента?',a:'Если A биективно Dₙ и a∈A, то после удаления a оставшиеся n−1 элементов можно перенумеровать как Dₙ₋₁. Значит, A\{a} конечно и имеет мощность n−1.',p:24},
{t:8,k:'Свойство',q:'Если A и B конечны, обязательно ли A∪B конечно?',a:'Да. Разбиваем объединение на непересекающиеся части A и B\A. Обе конечны, поэтому объединение конечно; его мощность равна |A|+|B\A|.',p:25},
{t:8,k:'Различие',q:'Когда формула |A∪B|=|A|+|B| верна без поправки?',a:'Когда A и B не пересекаются. Если пересечение непусто, элементы A∩B посчитаны дважды, поэтому их мощность нужно вычесть один раз.',p:25},
{t:9,k:'Применение',q:'Как из неравенства Бернулли получить оценку (1+1/n)ⁿ?',a:'Подставь x=1/n и показатель n: (1+1/n)ⁿ≥1+n·(1/n)=2. Условие x>−1 выполнено.',p:26},
{t:9,k:'Симметрия',q:'Как связаны коэффициенты Cₙᵏ и Cₙⁿ⁻ᵏ?',a:'Они равны: Cₙᵏ=Cₙⁿ⁻ᵏ. Это видно из формулы n!/[k!(n−k)!] — замена k на n−k меняет множители местами.',p:27},
{t:9,k:'Пример',q:'Разложи (a+b)³ по формуле Ньютона.',a:'(a+b)³=a³+3a²b+3ab²+b³. Коэффициенты 1,3,3,1 — третий ряд треугольника Паскаля.',p:27},
{t:10,k:'Следствие',q:'Что означает неравенство |x−a|<r в виде двойного неравенства?',a:'a−r<x<a+r. Оно говорит, что x находится от центра a на расстоянии меньше r.',p:29},
{t:10,k:'Доказательство',q:'Как вывести обратное неравенство ||x|−|y||≤|x−y|?',a:'Из |x|=|(x−y)+y|≤|x−y|+|y| получаем |x|−|y|≤|x−y|. Меняя x и y местами, получаем |y|−|x|≤|x−y|; вместе это и есть требуемая оценка.',p:29},
{t:10,k:'Свойство',q:'Как выразить расстояние между концами интервала через метрическую функцию?',a:'Длина отрезка [a,b] при a≤b равна ρ(a,b)=|a−b|=b−a. На прямой метрика совпадает с привычным расстоянием.',p:29},
{t:10,k:'Проверь себя',q:'Какие точки входят в U₂(3)?',a:'U₂(3)={x:|x−3|<2}=(1,5). Точки 1 и 5 не входят, потому что неравенство строгое.',p:29},
{t:11,k:'Формула',q:'Как разложить B на две непересекающиеся части, если A⊆B?',a:'B=A∪(B\\A), причём A и B\\A не пересекаются. Поэтому |B|=|A|+|B\\A| для элементарных множеств.',p:36}
].filter(card=>card.t<=11);
const $=id=>document.getElementById(id), stateKey='matan-colloquium-1-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(stateKey)||'{}');if(!localStorage.getItem(stateKey)){const old=JSON.parse(localStorage.getItem('matan-colloquium-1-v1')||'{}');for(const [id,known] of Object.entries(old))if(known&&Number(id)<31)saved[id]=true}}catch{}let deck=cards.map((_,i)=>i).filter(i=>cards[i].active!==false&&!saved[i]),pos=0,shown=false;
for(let i=1;i<=11;i++){const o=document.createElement('option');o.value=i;o.textContent=`Билет ${i}`;$('filter').append(o)}
function updateStats(){const total=cards.filter(card=>card.active!==false).length;const known=Object.keys(saved).filter(k=>saved[k]&&cards[Number(k)]?.active!==false).length;$('knownCount').textContent=known;$('leftCount').textContent=total-known;$('bar').style.width=`${known/total*100}%`;try{localStorage.setItem(stateKey,JSON.stringify(saved))}catch{}}
function render(){const item=cards[deck[pos]];$('stage').classList.remove('revealed');shown=false;$('flip').textContent='Показать ответ　↵';$('answer').style.display='';if(!item){$('question').textContent='В выбранной подборке карточки закончились.';$('answer').textContent='Выбери другой билет или сбрось прогресс.';$('answer').style.display='block';$('ticket').textContent='Готово';$('kind').textContent='';$('source').textContent='';$('position').textContent='';$('flip').disabled=true;$('again').disabled=true;$('know').disabled=true;updateStats();return}$('flip').disabled=false;$('again').disabled=false;$('know').disabled=false;$('ticket').textContent=`Билет ${item.t}`;$('kind').textContent=item.k;$('question').textContent=item.q;$('answer').textContent=item.a;$('source').textContent=`Конспект · страница ${item.p}`;$('position').textContent=`Карточка ${pos+1} из ${deck.length}`;$('know').textContent='Знаю　✓';updateStats()}
function move(delta){if(!deck.length)return;pos=(pos+delta+deck.length)%deck.length;render()}function flip(){if(!deck.length)return;shown=!shown;$('stage').classList.toggle('revealed',shown);$('flip').textContent=shown?'Скрыть ответ　↵':'Показать ответ　↵'}
$('flip').onclick=flip;$('again').onclick=()=>move(1);$('know').onclick=()=>{const id=deck[pos];saved[id]=true;deck.splice(pos,1);if(pos>=deck.length)pos=0;render()};$('filter').onchange=()=>{const v=$('filter').value;deck=cards.map((c,i)=>({c,i})).filter(x=>x.c.active!==false&&(v==='all'||String(x.c.t)===v)).map(x=>x.i).filter(i=>!saved[i]);pos=0;render()};$('reset').onclick=()=>{if(confirm('Сбросить все отметки «Знаю»?')){saved={};$('filter').value='all';deck=cards.map((_,i)=>i).filter(i=>cards[i].active!==false);pos=0;render()}};document.addEventListener('keydown',e=>{if(e.target=== $('filter'))return;if(e.code==='Space'){e.preventDefault();flip()}if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();
</script></body></html>
